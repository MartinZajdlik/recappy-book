name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"   # každých 10 minut
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -sS -m 10 -o /tmp/health.json -w "%{http_code}" https://recappy-book.onrender.com/actuator/health)
          echo "Health endpoint returned HTTP $status"
          cat /tmp/health.json
          if [ "$status" != "200" ]; then
            echo "Healthcheck failed (HTTP $status)"
            exit 1
          fi
